<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!--
      Anti-flash theme guard. Must stay here, first in <head>, and stay inline —
      it has to run before the first paint and before any stylesheet applies.

      The app's rule is: /admin may be dark (per the admin's own `admin-theme`
      preference), every other route is always light. React cannot enforce that on a
      cold load because it has not mounted yet, and next-themes' own anti-flash script
      is deliberately inert in this app (see src/components/theme-provider.tsx — it is
      served as application/json to silence a React 19 script-tag warning). Without
      this block, loading a public URL while `.dark` applies paints a light-designed
      page with dark tokens for a frame, which looks like a rendering fault.

      SPA navigation between routes is handled by RouteThemeSync in src/App.tsx.
    -->
    <script>
      (function () {
        try {
          var isAdmin = window.location.pathname.indexOf('/admin') === 0
          var dark = isAdmin && (localStorage.getItem('admin-theme') || 'dark') === 'dark'
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* private mode or blocked storage: fall back to light, which is the public default */
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <!-- No content-language pragma here: it is non-conforming and was reported
         as an invalid code. See docs/seo/language-and-images.md. The lang
         attribute above is the only language declaration. -->
    <meta name="format-detection" content="telephone=yes, date=no, email=yes, address=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Siddhivinayak Overseas" />
    <meta name="msapplication-TileColor" content="#ece2cf" />
    <!-- Google Analytics 4 — loaded inline so it fires on every deploy, independent of JS bundle version -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-MDVF551H1C"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // send_page_view:false — React Router sends page_view on every SPA navigation instead
      gtag('config', 'G-MDVF551H1C', { send_page_view: false });
      // Mark analytics as ready so analytics.ts doesn't inject a duplicate script
      window.__analyticsReady = true;
    </script>
    <!--
      Page metadata (title, description, canonical, Open Graph, Twitter, robots) is
      owned entirely by src/components/seo/SeoHead.tsx and hoisted into <head> by
      React 19. It deliberately does NOT live here: React appends its tags rather
      than replacing matching static ones, so a static canonical here would give
      every page two canonicals — and the prerenderer would bake both into the HTML.

      The title element below is only the pre-hydration fallback shown for the
      instant before React commits, and for the app-shell fallback on a route that
      has not been prerendered yet. React replaces it (titles are deduplicated,
      unlike meta). Do not write markup-looking text into comments in this file —
      it ends up in every prerendered page and confuses anything parsing the HTML.
    -->
    <title>Siddhivinayak Overseas</title>
    <meta name="theme-color" content="#ece2cf" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- Fonts load without blocking first paint: the preload promotes itself to
         a stylesheet on arrival. Keep the onload attribute (a JS-assigned
         handler would not survive prerendering) and the noscript fallback.
         See docs/seo/language-and-images.md. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      fetchpriority="high"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
      />
    </noscript>
    <link
      rel="preload"
      as="image"
      href="/earth-poster-768.avif"
      type="image/avif"
      fetchpriority="high"
      media="(min-width: 640px)"
    />
    <link rel="icon" type="image/png" href="/favicon/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon/favicon-16x16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script type="speculationrules">
      {"prefetch":[{"where":{"or":[{"href_matches":"/work-visa/**"},{"href_matches":"/study-visa/**"},{"href_matches":"/study-in-*/**"},{"href_matches":"/contact"}]}}]}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
